<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KENZO Temp Mail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="container">
    <header class="hero">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <h1>OXY<span>TEMPMAIL</span></h1>
      </div>
      <p class="tagline">Email sementara. Gratis. Tanpa daftar. Tanpa jejak.</p>
    </header>

    <section class="card main-card">
      <div class="card-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="card-title">~/generator</span>
      </div>

      <div class="card-body">
        <button id="btnGenerate" class="btn-primary">
          <span class="btn-icon">✦</span>
          GENERATE EMAIL BARU
        </button>

        <div id="emailBox" class="email-box hidden">
          <div class="email-display">
            <span class="label">EMAIL LU</span>
            <input type="text" id="emailAddr" readonly>
          </div>
          <div class="email-actions">
            <button id="btnCopy" class="btn-ghost">📋 Copy</button>
            <button id="btnRefresh" class="btn-ghost">🔄 Refresh</button>
          </div>
        </div>

        <p id="status" class="status"></p>
      </div>
    </section>

    <section class="card inbox-card">
      <div class="card-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="card-title">~/inbox</span>
        <span id="inboxCount" class="badge">0</span>
      </div>

      <div id="inbox" class="inbox">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <p>Belum ada email masuk</p>
          <span>Generate email dulu buat mulai</span>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p>Powered by <span>mail.tm</span> · Built by <span>OXY</span></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
